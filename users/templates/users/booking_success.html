<!DOCTYPE html>
<html>
<head>
    <title>Booking Success</title>
</head>
<body style="background:black;color:white;text-align:center;padding:100px;">

    <h1>✅ Booking Successful</h1>

    <h2>{{ movie.title }}</h2>

    <p>Seats Reserved:</p>

    <a href="{% url 'movie_list' %}">
        Back to Movies
    </a>

</body>
</html>
