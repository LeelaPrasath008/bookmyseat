{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MovieVerse Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
    linear-gradient(
        rgba(0,0,0,.85),
        rgba(0,0,0,.9)
    ),
    url("{% static 'movie/images/cinema-bg.jpg' %}");

    background-size:cover;
    background-position:center;
}

/* Floating Glow */

body::before{
    content:'';
    position:absolute;
    width:600px;
    height:600px;
    background:#ff1744;
    filter:blur(250px);
    opacity:.15;
    top:-150px;
    left:-150px;
}

body::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#ff1744;
    filter:blur(250px);
    opacity:.12;
    bottom:-150px;
    right:-150px;
}

/* Main Container */

.container{
    width:1100px;
    max-width:95%;
    display:flex;
    overflow:hidden;
    border-radius:30px;
    background:rgba(15,15,15,.85);
    backdrop-filter:blur(20px);

    box-shadow:
    0 0 50px rgba(255,23,68,.25);
}

/* Left Side */

.left-panel{
    width:50%;
    position:relative;

    background:
    linear-gradient(
        rgba(0,0,0,.3),
        rgba(0,0,0,.7)
    ),
    url("{% static 'movie/images/movie-poster.jpg' %}");

    background-size:cover;
    background-position:center;
}

.overlay{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;   /* Vertical center */
    align-items:center;       /* Horizontal center */

    text-align:center;
    padding:50px;
}

.overlay h1{
    font-size:4rem;
    font-weight:800;
    color:white;
}

.overlay h1 span{
    color:#ff1744;
}

.overlay p{
    margin-top:15px;
    color:#ddd;
    line-height:1.8;
    max-width:500px;
    font-size:18px;
}
/* Right Side */

.right-panel{
    width:50%;
    padding:70px 60px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo{
    font-size:2.8rem;
    font-weight:800;
    text-align:center;
    margin-bottom:15px;
    color:white;
}

.logo span{
    color:#ff1744;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:40px;
}

.form-group{
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:10px;
    color:white;
    font-weight:500;
}

input{
    width:100%;
    padding:18px;
    border:none;
    border-radius:15px;
    background:#1b1b1b;
    color:white;
    font-size:16px;
}

input:focus{
    outline:none;
    box-shadow:
    0 0 20px rgba(255,23,68,.4);
}

.login-btn{
    width:100%;
    padding:18px;
    margin-top:10px;

    border:none;
    border-radius:15px;

    background:#ff1744;
    color:white;

    font-size:18px;
    font-weight:600;

    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-4px);

    box-shadow:
    0 0 30px rgba(255,23,68,.6);
}

.register-link{
    text-align:center;
    margin-top:25px;
}

.register-link a{
    color:#ff1744;
    text-decoration:none;
    font-weight:600;
}

.errorlist{
    list-style:none;
    color:#ff5252;
    margin-bottom:10px;
}

/* Responsive */

@media(max-width:900px){

    .left-panel{
        display:none;
    }

    .right-panel{
        width:100%;
        padding:50px 30px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- Left -->

    <div class="left-panel">

        <div class="overlay">

            <h1>
                Movie<span>Verse</span>
            </h1>

            <p>
                Experience blockbuster movies,
                reserve your favorite seats,
                and enjoy seamless booking.
            </p>

        </div>

    </div>

    <!-- Right -->

    <div class="right-panel">

        <div class="logo">
            Movie<span>Verse</span>
        </div>

        <div class="subtitle">
            Welcome Back 🎬
        </div>

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required>

            </div>

            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </div>

    </div>

</div>

</body>
</html>
